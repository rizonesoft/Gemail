<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gemail -- Settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;color:#1b1d22;background:#ffffff}
a{color:#1668c9}a:hover{color:#125aae}
button,input,select{font-family:inherit}
</style>
</helmet>
<div style="width: 400px; height: 1160px; box-sizing: border-box; background: #ffffff; display: flex; flex-direction: column; font-size: 14px; line-height: 20px">

  <header style="display: flex; align-items: center; gap: 6px; padding: 12px 12px 12px 8px; border-bottom: 1px solid #e3e6eb">
    <a href="Main.dc.html" aria-label="Back" style="width: 36px; height: 36px; border-radius: 6px; color: #5e6470; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4.5L6.5 10l5.5 5.5"></path></svg>
    </a>
    <h1 style="margin: 0; font-size: 16px; font-weight: 600">Settings</h1>
  </header>

  <main style="flex-grow: 1; display: flex; flex-direction: column; gap: 24px; padding: 16px">

    <section style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 13px; font-weight: 600; color: #5e6470; text-transform: uppercase; letter-spacing: 0.4px">OpenRouter</h2>
      <label for="api-key" style="font-weight: 600; font-size: 13px">API key</label>
      <div style="display: flex; gap: 6px">
        <div style="flex-grow: 1; display: flex; align-items: center; border: 1px solid #c9ced6; border-radius: 6px; padding-left: 10px">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="#686e7a" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="6.5" cy="13.5" r="3"></circle><path d="M8.6 11.4L15.5 4.5M13 7l2 2"></path></svg>
          <input id="api-key" type="password" value="sk-or-v1-0000000000" style="flex-grow: 1; height: 32px; border: 0; padding: 0 8px; font-size: 13px; background: transparent">
          <button aria-label="Show key" style="width: 32px; height: 32px; border: 0; background: transparent; color: #5e6470; display: flex; align-items: center; justify-content: center">
            <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2.5 10s3-5.5 7.5-5.5S17.5 10 17.5 10s-3 5.5-7.5 5.5S2.5 10 2.5 10z"></path><circle cx="10" cy="10" r="2.5"></circle></svg>
          </button>
        </div>
        <button style="height: 34px; padding: 0 12px; border: 1px solid #c9ced6; border-radius: 6px; background: #ffffff; font-size: 13px; color: #1b1d22">Test</button>
      </div>
      <div role="status" style="display: flex; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 6px; background: #edf7f0; color: #1a7f37; font-size: 13px">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 10.5l3.5 3.5 7.5-8"></path></svg>
        Connected. [credit remaining] left on this key.
      </div>
      <div style="display: flex; gap: 6px; font-size: 12px; color: #5e6470">
        <svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 3px"><path d="M10 2.5l6 2.5v4.5c0 3.8-2.6 6.6-6 8-3.4-1.4-6-4.2-6-8V5z"></path></svg>
        <span>Stored on this device only. It is never synced and only ever sent to OpenRouter. <a href="#">Get a key</a></span>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 13px; font-weight: 600; color: #5e6470; text-transform: uppercase; letter-spacing: 0.4px">Model</h2>
      <div style="display: flex; align-items: center; gap: 8px; border: 1px solid #c9ced6; border-radius: 6px; padding: 0 10px; height: 34px">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="#686e7a" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="9" r="5.5"></circle><path d="M13 13l4 4"></path></svg>
        <label for="model-search" style="position: absolute; width: 1px; height: 1px; overflow: hidden">Search models</label>
        <input id="model-search" placeholder="Search every OpenRouter model" style="flex-grow: 1; border: 0; font-size: 13px; background: transparent">
      </div>
      <div role="radiogroup" aria-label="Model" style="display: flex; flex-direction: column; border: 1px solid #e3e6eb; border-radius: 8px; overflow: hidden">
        <sc-for list="{{ models }}" as="m" hint-placeholder-count="4">
          <label style="display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-bottom: 1px solid #eef0f3; background: {{ m.bg }}">
            <input type="radio" name="model" checked="{{ m.selected }}" style="margin: 3px 0 0 0; accent-color: #1668c9">
            <span style="display: flex; flex-direction: column; flex-grow: 1">
              <span style="display: flex; gap: 6px; align-items: center">
                <span style="font-weight: 600; font-size: 13px">{{ m.name }}</span>
                <sc-if value="{{ m.tag }}" hint-placeholder-val="{{ true }}">
                  <span style="font-size: 11px; line-height: 16px; padding: 0 6px; border-radius: 8px; background: #f1edfb; color: #5b43b8">{{ m.tag }}</span>
                </sc-if>
              </span>
              <span style="font-size: 12px; color: #686e7a">{{ m.meta }}</span>
            </span>
          </label>
        </sc-for>
      </div>
      <span style="font-size: 12px; color: #686e7a">Recommended picks are chosen from the live catalogue. Prices come from OpenRouter.</span>
    </section>

    <section style="display: flex; flex-direction: column; gap: 12px">
      <h2 style="margin: 0; font-size: 13px; font-weight: 600; color: #5e6470; text-transform: uppercase; letter-spacing: 0.4px">Writing</h2>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="creativity" style="font-size: 13px; font-weight: 600">Creativity</label>
        <input id="creativity" type="range" min="0" max="100" value="45" style="accent-color: #1668c9">
        <div style="display: flex; justify-content: space-between; font-size: 12px; color: #686e7a"><span>Precise</span><span>Balanced</span><span>Creative</span></div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <label for="tone" style="font-size: 12px; color: #5e6470">Default tone</label>
          <select id="tone" style="height: 32px; padding: 0 8px; border: 1px solid #c9ced6; border-radius: 6px; background: #ffffff; font-size: 13px"><option>Professional</option></select>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px">
          <label for="lang" style="font-size: 12px; color: #5e6470">Write in</label>
          <select id="lang" style="height: 32px; padding: 0 8px; border: 1px solid #c9ced6; border-radius: 6px; background: #ffffff; font-size: 13px"><option>English</option></select>
        </div>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 13px; font-weight: 600; color: #5e6470; text-transform: uppercase; letter-spacing: 0.4px">Privacy</h2>
      <label style="display: flex; gap: 12px; align-items: flex-start">
        <span style="flex-grow: 1; display: flex; flex-direction: column">
          <span style="font-size: 13px; font-weight: 600">Only providers that don't keep my data</span>
          <span style="font-size: 12px; color: #686e7a">Fewer models are available when this is on.</span>
        </span>
        <input type="checkbox" role="switch" style="width: 36px; height: 20px; margin: 2px 0 0 0; accent-color: #1668c9">
      </label>
    </section>

    <div style="display: flex; flex-direction: column; gap: 12px; margin-top: auto">
      <button style="height: 40px; border: 0; border-radius: 6px; background: #1668c9; color: #ffffff; font-size: 14px; font-weight: 600">Save settings</button>
      <button style="height: 36px; border: 1px solid #f1c8c3; border-radius: 6px; background: #ffffff; color: #c42b1c; font-size: 13px">Clear all Gemail data...</button>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":1160}}'>
class Component extends DCLogic {
  renderVals() {
    const rows = [
      { name: 'Gemini 2.5 Flash', tag: 'Recommended', meta: 'Google · 1M context · fast', selected: true },
      { name: 'Claude Haiku 4.5', tag: 'Fast', meta: 'Anthropic · 200K context', selected: false },
      { name: 'Claude Sonnet 5', tag: 'Best writing', meta: 'Anthropic · for careful replies', selected: false },
      { name: 'Browse all models', tag: '', meta: 'Grouped by provider, with context and price', selected: false }
    ];
    return { models: rows.map((r) => ({ ...r, bg: r.selected ? '#f3f8fd' : '#ffffff' })) };
  }
}
</script>
</body>
</html>
